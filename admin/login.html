<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin Login — Ahmed Mahmoud Photography</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/assets/icons/favicon-32x32.png" />
<link rel="stylesheet" href="/css/reset.css" />
<link rel="stylesheet" href="/css/variables.css" />
<link rel="stylesheet" href="/css/typography.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-login">
    <div class="admin-login__panel">
      <img class="admin-login__logo" src="/assets/brand/logo.png" alt="Ahmed Mahmoud Photography" />
      <p class="type-label text-center" style="margin-bottom:24px;">Admin Sign In</p>

      <div id="expired-notice" style="display:none;" class="field-error text-center" role="alert" aria-live="polite">
        Your session expired. Please sign in again.
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <div id="form-error" class="field-error" role="alert" aria-live="polite" style="display:none; margin-bottom:16px;"></div>
        <button type="submit" class="btn btn--primary btn--block" id="submit-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { login } from "/js/auth.js";
    import { isAuthenticated } from "/js/auth.js";

    const params = new URLSearchParams(location.search);
    if (params.get("expired")) document.getElementById("expired-notice").style.display = "block";

    if (isAuthenticated()) location.replace(params.get("next") || "/admin/dashboard.html");

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("form-error");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in\u2026";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await login(email, password);
        location.href = params.get("next") || "/admin/dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message || "Invalid email or password.";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
